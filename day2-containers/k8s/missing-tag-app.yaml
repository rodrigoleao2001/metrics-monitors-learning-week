apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: payments-worker
  namespace: default
  labels:
    app: payments-worker
    team: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-worker
  template:
    metadata:
      labels:
        app: payments-worker
        team: payments
    spec:
      containers:
        - name: worker
          image: polinux/stress
          command: ["stress"]
          args: ["--cpu", "1", "--timeout", "99999s"]
          resources:
            requests:
              cpu: "40m"
              memory: "32Mi"
            limits:
              cpu: "80m"
              memory: "64Mi"
