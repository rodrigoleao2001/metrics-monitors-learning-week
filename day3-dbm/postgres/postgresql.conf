# PostgreSQL configuration optimized for DBM Lab
listen_addresses = '*'
port = 5432

# pg_stat_statements for DBM
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.save = on

# Performance settings
max_connections = 100
shared_buffers = 128MB
work_mem = 4MB
effective_cache_size = 256MB

# Logging for observability
log_min_duration_statement = 100
log_statement = 'none'
log_lock_waits = on
deadlock_timeout = 1s

# Activity tracking
track_activities = on
track_counts = on
track_io_timing = on
track_wal_io_timing = on

# Note: stats_temp_directory was removed in PostgreSQL 15 (statistics moved to shared memory)
